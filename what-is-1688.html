<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>What is 1688 storyboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--red:#FF0051;--dp:#13002D;--pu:#32006E;--grey:#484F56;--blk:#1F2323;--lg:#ECEDEE;--wh:#FFFFFF;--line:#ECEDEE;--mut:#484F56;--bg:#ECEDEE}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:15px/1.6 Poppins,sans-serif;background:var(--bg);color:var(--blk);-webkit-font-smoothing:antialiased}
.sb-gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#FF0051 0%,#FF0051 30%,#13002D 100%);z-index:50;padding:16px}
.sb-gate .gc{background:#fff;border-radius:16px;padding:32px 28px;max-width:420px;width:100%}
.sb-gate .ey{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:8px}
.sb-gate h1{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin-bottom:6px}
.sb-gate p{color:var(--mut);font-size:14px;margin-bottom:18px}
.sb-gate form{display:flex;gap:8px}
.sb-gate input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:15px Poppins,sans-serif}
.sb-gate button{border:0;background:var(--red);color:#fff;font:600 14px Poppins,sans-serif;padding:0 18px;border-radius:10px;cursor:pointer}
.gate-err{color:var(--red);font-size:13px;margin-top:10px}
#sb-doc{display:none}
#sb-doc.on{display:block}
.wrap{display:flex;max-width:1360px;margin:0 auto}
nav.side{position:sticky;top:0;height:100vh;width:250px;flex:none;padding:28px 18px;border-right:1px solid var(--line);overflow:auto;background:#fff}
nav.side .logo{height:26px;margin-bottom:26px;display:block}
nav.side .nt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:10px}
nav.side a{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:8px;color:var(--blk);text-decoration:none;font-size:13.5px;line-height:1.35}
nav.side a .n{font-weight:700;color:var(--mut);font-size:12px;flex:none;width:22px}
nav.side a i{margin-left:auto;width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
nav.side a.picked i{background:var(--red)}
nav.side a.on{background:var(--lg)}
main{flex:1;min-width:0;padding:40px 40px 160px}
.top .ey{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:10px}
.top h1{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:12px}
.lede{font-size:17px;max-width:72ch;color:#484F56;margin-bottom:8px}
.stamp{font-size:12.5px;color:var(--mut);margin-bottom:18px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.lg{font-size:12px;font-weight:600;color:#fff;padding:4px 10px;border-radius:999px}
.lt{font-size:12px;color:var(--mut)}
.kF{background:var(--blk)} .kA{background:linear-gradient(135deg,#32006E 70%,#13002D)} .kG{background:linear-gradient(135deg,#FF0051 70%,#13002D)}
.intro2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:26px 0 36px}
.intro2>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.intro2 h3,.gnote h3{font-size:15px;font-weight:700;margin-bottom:10px}
.intro2 ul{padding-left:18px;font-size:13.5px;color:#484F56}
.intro2 li{margin-bottom:8px}
.sb{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 26px 22px;margin-bottom:28px;scroll-margin-top:16px;transition:box-shadow .15s,border-color .15s}
.sb.sel{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.sbh{display:flex;gap:18px;align-items:flex-start}
.sid{flex:none;width:52px;height:52px;border-radius:12px;background:var(--dp);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.sb.sel .sid{background:var(--red)}
.sbt{flex:1;min-width:0}
.sbt h2{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-bottom:6px}
.rec{font-size:11.5px;font-weight:600;color:var(--red);margin-left:10px;letter-spacing:0;vertical-align:middle}
.log{font-size:15.5px;color:#484F56;max-width:80ch;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;background:var(--lg);border-radius:999px;padding:3px 10px;color:var(--grey);font-weight:500}
.pick{flex:none;display:flex;align-items:center;gap:9px;border:1.5px solid var(--blk);background:#fff;border-radius:10px;padding:10px 14px;font:600 13.5px Poppins,sans-serif;cursor:pointer;color:var(--blk)}
.pick .bx{width:18px;height:18px;border:1.5px solid var(--blk);border-radius:5px;display:inline-block;position:relative}
.sb.sel .pick{background:var(--red);border-color:var(--red);color:#fff}
.sb.sel .pick .bx{border-color:#fff;background:#fff}
.sb.sel .pick .bx:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--red);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.note{display:none;margin:16px 0 0 70px}
.sb.sel .note{display:block}
.note label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;display:block;margin-bottom:6px}
.note textarea,.gnote textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:14px/1.5 Poppins,sans-serif;resize:vertical;min-height:54px;background:#FFFFFF}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0 12px}
.three>div{background:#ECEDEE;border-radius:12px;padding:14px 16px}
.three h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:6px}
.three p{font-size:13.5px;color:#484F56}
.vo{font-size:13px;color:var(--grey);margin-bottom:16px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pn{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.fr{aspect-ratio:16/9;padding:10px 12px;color:#fff;position:relative;display:flex;flex-direction:column}
.fr .kl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.fr .tc{position:absolute;top:9px;right:11px;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);padding:1px 7px;border-radius:999px}
.fr p{font-size:12.5px;line-height:1.4;margin-top:auto;font-weight:500}
.snd{padding:10px 12px 12px;flex:1}
.snd .who{display:block;font-size:11px;font-weight:700;color:var(--red);margin-bottom:4px;letter-spacing:.02em}
.snd p{font-size:13px;line-height:1.45;color:var(--blk)}
.gnote{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 24px;z-index:20}
.bar-in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;justify-content:space-between}
.status{font-size:13px;color:var(--mut)} .status b{color:var(--blk)}
.btn{border:0;background:var(--red);color:#fff;font:600 14px Poppins,sans-serif;padding:13px 22px;border-radius:10px;cursor:pointer;white-space:nowrap}
.btn:disabled{background:#C9CCD0;cursor:not-allowed}
.btn.done{background:var(--dp)}
.lockw{text-align:center;padding:0 0 90px;font-size:12px}
.lockw a{color:var(--mut)}
@media(max-width:1000px){nav.side{display:none}main{padding:28px 16px 170px}.three{grid-template-columns:1fr}.intro2{grid-template-columns:1fr}}
@media(max-width:620px){.top h1{font-size:28px}.sbh{flex-wrap:wrap}.pick{width:100%;justify-content:center}.note{margin-left:0}.sbt h2{font-size:20px}.bar-in{flex-direction:column;align-items:stretch;gap:8px}.btn{width:100%}.sb{padding:18px 16px}}

.sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:24px;scroll-margin-top:16px}
.sec>h2{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;display:flex;gap:12px;align-items:baseline}
.sec>h2 .n{font-size:13px;color:var(--red);font-weight:700;letter-spacing:.04em}
.sec>.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.vd{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.vd>div{background:#ECEDEE;border-radius:12px;padding:14px 16px}
.vd h4{font-size:14px;font-weight:700;margin-bottom:4px}
.vd p{font-size:13.5px;color:#484F56}
.verdict{font-size:18px;font-weight:700;margin-bottom:14px}
.verdict b{color:var(--red)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:10px 18px;font-size:14.5px}
.kv dt{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--red);font-weight:700;padding-top:3px}
.kv dd{color:#1F2323}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:2px 0 14px}
.flow{display:flex;gap:6px;margin:6px 0 10px}
.fl{flex:var(--w);min-width:0;border-radius:10px;padding:12px;color:#fff;background:linear-gradient(135deg,#32006E 70%,#13002D)}
.fl.hot{background:linear-gradient(135deg,#FF0051 70%,#13002D)}
.fl b{display:block;font-size:14px}
.fl span{font-size:11.5px;opacity:.85;display:block}
.fl p{font-size:12.5px;margin-top:6px;line-height:1.4}
.ch{border-top:1px solid var(--line);padding-top:20px;margin-top:20px;scroll-margin-top:16px}
.ch:first-of-type{border-top:0;margin-top:0;padding-top:0}
.chh{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.chh h3{font-size:19px;font-weight:800;letter-spacing:-.3px}
.chh .tm{font-size:12px;font-weight:600;background:#ECEDEE;border-radius:999px;padding:2px 10px;color:#484F56}
.chh .q{font-size:12.5px;font-weight:600;color:var(--red)}
.job{font-size:13.5px;color:#484F56;margin-bottom:12px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:8px 10px;border-bottom:1.5px solid #1F2323}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td:first-child{font-weight:700;white-space:nowrap;color:var(--red)}
.opt{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.opt.sel{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.opt .bx{flex:none;width:20px;height:20px;border:1.5px solid #1F2323;border-radius:5px;margin-top:2px;position:relative}
.opt.sel .bx{background:var(--red);border-color:var(--red)}
.opt.sel .bx:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.opt b{font-size:15px}
.opt .rec{margin-left:8px}
.opt p{font-size:13.5px;color:#484F56}
.opt textarea{display:none;margin-top:8px;width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px Poppins,sans-serif}
.opt.sel textarea{display:block}
.who2{font-size:11.5px;font-weight:700;color:#484F56;background:#ECEDEE;border-radius:999px;padding:2px 9px;white-space:nowrap}
@media(max-width:620px){.flow{flex-direction:column}.kv{grid-template-columns:1fr}.sec{padding:18px 16px}table.t{font-size:12.5px}}
</style>
</head>

const SB_LS = 'wf1688w1_pw';
let bound=false;
function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function dec(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(SB_BLOB.salt),iterations:SB_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(SB_BLOB.iv)},key,b64b(SB_BLOB.ciphertext));
  return JSON.parse(new TextDecoder().decode(pt));
}
function sel(){return Array.prototype.slice.call(document.querySelectorAll('.opt.sel'));}
function update(){
  const s=sel(); document.getElementById('status').innerHTML = s.length
    ? '<b>'+s.length+'</b> picked · notes and defaults go in the prompt too'
    : 'Nothing ticked means you accept my recommended title and thumbnail. Add notes, then copy.';
  const b=document.getElementById('copy'); b.classList.remove('done'); b.textContent='Copy prompt';
}
function buildPrompt(){
  const L=['== 1688 what-is-1688 · storyboard review =='];
  ['Title','Thumbnail'].forEach(function(g){
    const s=sel().filter(function(o){return o.dataset.g===g;});
    if(!s.length){L.push(g+': recommended (no pick)');return;}
    L.push(g+' ('+s.length+' picked, 1 suggested):');
    s.forEach(function(o,n){const t=o.querySelector('textarea').value.trim();L.push('  '+(n+1)+'. '+o.dataset.name+(t?' [note: '+t+']':''));});
  });
  const g=document.getElementById('gnote').value.trim();
  L.push(g?'NOTES: '+g:'NOTES: none, defaults in section 09 stand');
  L.push('> Counts are my call, work with exactly what I ticked.');
  L.push('> Apply my notes, then produce the edit pack: EDL by clip ID with in and out lines, the final 7 VO lines as an audio brief, AI b-roll prompts ready to generate, graphics brief, and the asks message to 1688.');
  return L.join('\n');
}
function bind(){
  if(bound)return; bound=true;
  document.querySelectorAll('.opt').forEach(function(o){
    o.addEventListener('click',function(ev){if(ev.target.tagName==='TEXTAREA')return;o.classList.toggle('sel');update();});
  });
  document.getElementById('copy').addEventListener('click',async function(){
    const txt=buildPrompt();
    try{await navigator.clipboard.writeText(txt);}catch(x){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
    const b=document.getElementById('copy'); b.classList.add('done'); b.textContent='Copied · paste it to Claude';
  });
  const links=Array.prototype.slice.call(document.querySelectorAll('nav.side a[data-s]'));
  const secs=links.map(function(a){return document.getElementById(a.dataset.s);}).filter(Boolean);
  function spy(){let cur=-1;secs.forEach(function(s,i){if(s.getBoundingClientRect().top<=140)cur=i;});links.forEach(function(a,i){a.classList.toggle('on',i===cur);});}
  window.addEventListener('scroll',spy,{passive:true}); spy(); update();
}
function reveal(o){const st=document.getElementById('sb-stage');if(!st.dataset.filled){st.innerHTML=o.body;st.dataset.filled='1';}
  document.getElementById('sb-gate').style.display='none';document.getElementById('sb-doc').classList.add('on');bind();}
async function tryPw(pw,silent){const err=document.getElementById('sb-err');
  try{const o=await dec(pw);try{localStorage.setItem(SB_LS,pw);}catch(x){}reveal(o);}
  catch(x){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(SB_LS);}catch(y){}}}
document.getElementById('sb-form').addEventListener('submit',function(ev){ev.preventDefault();tryPw(document.getElementById('sb-pw').value,false);});
document.getElementById('sb-lock').addEventListener('click',function(ev){ev.preventDefault();try{localStorage.removeItem(SB_LS);}catch(x){}location.reload();});
(function(){let s=null;try{s=localStorage.getItem(SB_LS);}catch(x){}if(s)tryPw(s,true);else document.getElementById('sb-pw').focus();})();
</script>
</body></html>
