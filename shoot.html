const SH_LS = 'wf1688sh_pw';
let shBound = false;
function b64b(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function shDecrypt(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64b(SH_BLOB.salt),iterations:SH_BLOB.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64b(SH_BLOB.iv)},key,b64b(SH_BLOB.ciphertext));
  return JSON.parse(new TextDecoder().decode(pt));
}
function shReveal(o){
  const stage=document.getElementById('sh-stage');
  if(!stage.dataset.filled){stage.innerHTML=o.body;stage.dataset.filled='1';}
  document.getElementById('sh-gate').style.display='none';
  document.getElementById('sh-doc').classList.add('on');
  if(shBound)return; shBound=true;
  const links=Array.prototype.slice.call(document.querySelectorAll('nav.side a[data-s]'));
  const secs=links.map(function(a){return document.getElementById(a.dataset.s);}).filter(Boolean);
  function spy(){
    let cur=0;
    secs.forEach(function(s,i){if(s.getBoundingClientRect().top<=140)cur=i;});
    links.forEach(function(a,i){a.classList.toggle('on',i===cur);});
  }
  window.addEventListener('scroll',spy,{passive:true});
  spy();
}
async function shTry(pw,silent){
  const err=document.getElementById('sh-err');
  try{const o=await shDecrypt(pw);try{localStorage.setItem(SH_LS,pw);}catch(e){}shReveal(o);}
  catch(e){if(!silent){err.textContent='wrong password';err.hidden=false;}try{localStorage.removeItem(SH_LS);}catch(e2){}}
}
document.getElementById('sh-form').addEventListener('submit',function(e){e.preventDefault();shTry(document.getElementById('sh-pw').value,false);});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='sh-lock'){e.preventDefault();try{localStorage.removeItem(SH_LS);}catch(err){}location.reload();}});
(function(){let s=null;try{s=localStorage.getItem(SH_LS);}catch(e){}if(s)shTry(s,true);else document.getElementById('sh-pw').focus();})();
</script>
